name: Build Python 3.14 wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "paddle-v*"

permissions:
  contents: read

concurrency:
  group: python314-wheels-${{ github.ref }}
  cancel-in-progress: true

env:
  PY_VERSION: "3.14"
  WITH_GPU: "OFF"
  WITH_DISTRIBUTE: "OFF"
  WITH_TESTING: "OFF"
  WITH_TENSORRT: "OFF"
  WITH_ONNXRUNTIME: "OFF"
  WITH_NCCL: "OFF"
  WITH_RCCL: "OFF"
  WITH_SHARED_PHI: "ON"
  ON_INFER: "ON"
  GENERATOR: "Ninja"
  CMAKE_BUILD_TYPE: "Release"
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  MAX_JOBS: "2"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows CPython 3.14
            os: windows-2025
            platform: windows-amd64
          - name: macOS arm64 CPython 3.14
            os: macos-14
            platform: macos-arm64
          - name: Linux x86_64 CPython 3.14
            os: ubuntu-22.04
            platform: linux-amd64

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Fetch OpenBLAS release tags
        shell: bash
        run: |
          git -C third_party/openblas fetch --tags --force origin
          git -C third_party/protobuf fetch --tags --force origin
          git -C third_party/pocketfft fetch --tags --force origin
          git -C third_party/sleef fetch --tags --force origin

      - name: Set up Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            paddle/scripts/compile_requirements.txt

      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "vswhere.exe was not found: $vswhere"
          }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vsPath)) {
            throw "A Visual Studio installation with the x64 C++ toolset was not found"
          }
          $devCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
          $dump = & cmd.exe /d /s /c "`"$devCmd`" -arch=x64 -host_arch=x64 && set"
          if ($LASTEXITCODE -ne 0) {
            throw "VsDevCmd.bat failed with exit code $LASTEXITCODE"
          }
          $environment = @{}
          foreach ($line in $dump) {
            if ($line -match "^([^=]+)=(.*)$") {
              $environment[$matches[1]] = $matches[2]
            }
          }
          foreach ($name in @("PATH", "INCLUDE", "LIB", "LIBPATH", "VCINSTALLDIR", "VCToolsInstallDir", "WindowsSdkDir", "WindowsSDKVersion", "UniversalCRTSdkDir", "UCRTVersion", "VSCMD_ARG_HOST_ARCH", "VSCMD_ARG_TGT_ARCH", "VisualStudioVersion", "VSINSTALLDIR")) {
            $actualName = $environment.Keys | Where-Object { $_ -ieq $name } | Select-Object -First 1
            if ($null -ne $actualName) {
              "$name=$($environment[$actualName])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          $cl = & cmd.exe /d /s /c "`"$devCmd`" -arch=x64 -host_arch=x64 && where cl"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($cl)) {
            throw "The x64 MSVC compiler was not found after loading VsDevCmd.bat"
          }

      - name: Install native build tools
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            command -v cmake >/dev/null || brew install cmake
            command -v ninja >/dev/null || brew install ninja
          else
            sudo apt-get update
            sudo apt-get install -y cmake ninja-build ccache libssl-dev
          fi

      - name: Install Python build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r paddle/scripts/compile_requirements.txt
          python -m pip install -r python/requirements.txt

      - name: Install and verify Ninja on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install ninja
          $ninjaBin = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          $ninjaBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          ninja --version

      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail
          python -VV
          python -m pip list
          cmake --version
          ninja --version
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            where.exe cl
          else
            command -v c++
            c++ --version
          fi

      - name: Build wheel on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WITH_MKL: "OFF"
          WITH_AVX: "OFF"
          MSVC_STATIC_CRT: "ON"
          WITH_ARM: "OFF"
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHON_EXECUTABLE = (Get-Command python).Source
          if (Test-Path -LiteralPath "build") {
            Remove-Item -LiteralPath "build" -Recurse -Force
          }
          if (Test-Path -LiteralPath "dist") {
            Remove-Item -LiteralPath "dist" -Recurse -Force
          }
          & python -X utf8 setup.py bdist_wheel

      - name: Build wheel on macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        env:
          WITH_MKL: "OFF"
          WITH_AVX: "OFF"
          WITH_ARM: ${{ runner.os == 'macOS' && 'ON' || 'OFF' }}
        run: |
          set -euxo pipefail
          export PYTHONUTF8=1
          export PYTHONIOENCODING=utf-8
          export PYTHON_EXECUTABLE="$(command -v python)"
          rm -rf build dist
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python -X utf8 setup.py bdist_wheel --plat-name=macosx_11_0_arm64
          else
            python -X utf8 setup.py bdist_wheel
          fi

      - name: Install and smoke-test wheel
        shell: bash
        run: |
          set -euxo pipefail
          wheel=(dist/*.whl)
          test "${#wheel[@]}" -eq 1
          python -m pip install --force-reinstall --no-deps "${wheel[0]}"
          python -X utf8 -c "import paddle; print(paddle.__version__); print(paddle.zeros([2, 3]))"

      - name: Upload wheel
        uses: actions/upload-artifact@v7.0.1
        with:
          name: paddle-python314-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14
