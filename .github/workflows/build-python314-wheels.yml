name: Build Python 3.14 wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "paddle-v*"

permissions:
  contents: read

concurrency:
  group: python314-wheels-${{ github.ref }}
  cancel-in-progress: true

env:
  PY_VERSION: "3.14"
  WITH_GPU: "OFF"
  WITH_DISTRIBUTE: "OFF"
  WITH_TESTING: "OFF"
  WITH_TENSORRT: "OFF"
  WITH_ONNXRUNTIME: "OFF"
  WITH_SHARED_PHI: "ON"
  ON_INFER: "ON"
  GENERATOR: "Ninja"
  CMAKE_BUILD_TYPE: "Release"
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  MAX_JOBS: "2"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows CPython 3.14
            os: windows-2025
            platform: windows-amd64
          - name: macOS arm64 CPython 3.14
            os: macos-14
            platform: macos-arm64
          - name: Linux x86_64 CPython 3.14
            os: ubuntu-22.04
            platform: linux-amd64

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            paddle/scripts/compile_requirements.txt

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install native build tools
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            command -v cmake >/dev/null || brew install cmake
            command -v ninja >/dev/null || brew install ninja
          else
            sudo apt-get update
            sudo apt-get install -y cmake ninja-build ccache libssl-dev
          fi

      - name: Install Python build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r paddle/scripts/compile_requirements.txt
          python -m pip install -r python/requirements.txt

      - name: Install and verify Ninja on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install ninja
          $ninjaBin = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          $ninjaBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          ninja --version

      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail
          python -VV
          python -m pip list
          cmake --version
          ninja --version
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            where.exe cl
          else
            command -v c++
            c++ --version
          fi

      - name: Build wheel on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WITH_MKL: "OFF"
          WITH_AVX: "OFF"
          MSVC_STATIC_CRT: "ON"
          WITH_ARM: "OFF"
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHON_EXECUTABLE = (Get-Command python).Source
          if (Test-Path -LiteralPath "build") {
            Remove-Item -LiteralPath "build" -Recurse -Force
          }
          if (Test-Path -LiteralPath "dist") {
            Remove-Item -LiteralPath "dist" -Recurse -Force
          }
          & python -X utf8 setup.py bdist_wheel

      - name: Build wheel on macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        env:
          WITH_MKL: "OFF"
          WITH_AVX: "OFF"
          WITH_ARM: ${{ runner.os == 'macOS' && 'ON' || 'OFF' }}
        run: |
          set -euxo pipefail
          export PYTHONUTF8=1
          export PYTHONIOENCODING=utf-8
          export PYTHON_EXECUTABLE="$(command -v python)"
          rm -rf build dist
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python -X utf8 setup.py bdist_wheel --plat-name=macosx_11_0_arm64
          else
            python -X utf8 setup.py bdist_wheel
          fi

      - name: Install and smoke-test wheel
        shell: bash
        run: |
          set -euxo pipefail
          wheel=(dist/*.whl)
          test "${#wheel[@]}" -eq 1
          python -m pip install --force-reinstall --no-deps "${wheel[0]}"
          python -X utf8 -c "import paddle; print(paddle.__version__); print(paddle.zeros([2, 3]))"

      - name: Upload wheel
        uses: actions/upload-artifact@v5
        with:
          name: paddle-python314-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14
